name: Feedback
description: Pre-filled from the USEAGE WINDOW widget's feedback bar. One line is enough.
title: "[feedback] "
labels: ["feedback"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Which number was unclear? Which refresh looked wrong? What do you check every day that is missing?
      placeholder: Any feedback?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "0.2.0"
  - type: markdown
    attributes:
      value: |
        This form is in English; write the feedback body in any language you like — the reply comes back in the language you used.

        Every issue gets a reply (adopted / not adopted, with the reason). Adopted ones are credited in the CHANGELOG of the release that ships them.
